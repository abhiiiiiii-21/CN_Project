# ==============================================================================
# Nginx HTTPS Load Balancer Configuration Template (Mac 2)
# ==============================================================================
# Upstream backends located on Mac 3 (Ports 3001 and 3002)
# TLS termination on Mac 2 edge proxy (Port 8443)
# NOTE: Both backends run as separate processes on Mac 3.

upstream team_backend {
    server 10.7.29.148:3001;
    server 10.7.29.148:3002;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    # TLS Certificates (Placeholders - do not commit private keys)
    ssl_certificate /opt/homebrew/etc/nginx/certs/app.crt;       # e.g., /path/to/certs/app.crt
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.key;   # e.g., /path/to/certs/app.key

    # TLS Protocol & Cipher Suite Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reverse proxy to Mac 3 upstream pool
    location / {
        proxy_pass http://team_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Upstream tracking header
        add_header X-Upstream-Addr $upstream_addr always;

        # Timeouts and failover settings
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
